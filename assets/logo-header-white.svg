<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56" role="img" aria-label="Clavería Abogados">
  <!-- Scale icon -->
  <g fill="#4DA6FF">
    <!-- Center pole -->
    <rect x="29" y="8" width="2" height="28" rx="1"/>
    <!-- Base -->
    <rect x="20" y="36" width="20" height="2.5" rx="1.25"/>
    <!-- Left arm -->
    <rect x="12" y="10" width="18" height="1.5" rx="0.75"/>
    <!-- Right arm -->
    <rect x="30" y="10" width="18" height="1.5" rx="0.75"/>
    <!-- Top bar -->
    <rect x="22" y="8" width="16" height="2.5" rx="1.25"/>
    <!-- Left bowl -->
    <path d="M12 11.5 Q9 16 9 18 Q9 22 21 22 Q33 22 33 18 Q33 16 30 11.5 Z" fill="none" stroke="#4DA6FF" stroke-width="1.5"/>
    <!-- Right bowl -->
    <path d="M30 11.5 Q27 16 27 18 Q27 22 39 22 Q51 22 51 18 Q51 16 48 11.5 Z" fill="none" stroke="#4DA6FF" stroke-width="1.5"/>
  </g>

  <!-- Text CLAVERÍA -->
  <text x="68" y="24" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700" letter-spacing="2" fill="#FFFFFF" style="text-transform:uppercase">CLAVERÍA</text>
  <!-- Text ABOGADOS -->
  <text x="68" y="42" font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="400" letter-spacing="3" fill="rgba(255,255,255,0.7)" style="text-transform:uppercase">ABOGADOS</text>
</svg>
